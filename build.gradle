import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'maven-publish'
    id 'checkstyle'
    id 'jacoco'
    id 'org.sonarqube' version '6.0.1.5171'
    id 'org.springframework.boot' version '3.5.3' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'gr.netmechanics'
version = '1.1.0'

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-web'

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation libs.woodstox.core
    implementation libs.underscore
    implementation libs.commons.validator

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly("org.projectlombok:lombok")
    testAnnotationProcessor("org.projectlombok:lombok")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.platform:junit-platform-suite'
}

// ─── Checkstyle ──────────────────────────────────────────────────────────────

checkstyle {
    toolVersion = '13.4.1'
    configFile = file("${rootDir}/checkstyle.xml")
    ignoreFailures = false
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

// ─── JaCoCo ──────────────────────────────────────────────────────────────────

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = false
        csv.required = false
    }
}

// ─── SonarQube ───────────────────────────────────────────────────────────────

sonar {
    properties {
        property 'sonar.coverage.jacoco.xmlReportPaths', "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        // Sonar picks up your Checkstyle config automatically if present at:
        // config/checkstyle/checkstyle.xml — or set it explicitly:
        // property 'sonar.java.checkstyle.reportPaths', "${layout.buildDirectory.get()}/reports/checkstyle/main.xml"
    }
}

// ─── Publishing ───────────────────────────────────────────────────────────────

publishing {
    repositories {
        if (project.hasProperty("nexus_username")) {
            maven {
                name = "NetmechanicsPublicNexus"
                url = 'https://nexus.nmlabs.gr/repository/m2public/'
                credentials {
                    username = "${nexus_username}"
                    password = "${nexus_password}"
                }
            }
        }
    }
    publications {
        create("javaMaven", MavenPublication) {
            groupId = project.group
            artifactId = 'epp-client-gr'
            version = project.version
            from components.java
            pom {
                name = 'epp-client-gr'
                description = 'EPP client library for the .gr domain registry'
                url = 'https://github.com/pbaris/epp-client-gr'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/pbaris/epp-client-gr.git'
                    developerConnection = 'scm:git:ssh://github.com/pbaris/epp-client-gr.git'
                    url = 'https://github.com/pbaris/epp-client-gr'
                }
                developers {
                    developer {
                        id = 'pbaris'
                        name = 'Panos Bariamis'
                    }
                }
            }
        }
    }
}

// ─── Compiler ─────────────────────────────────────────────────────────────────

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

// ─── Tests ────────────────────────────────────────────────────────────────────

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Support both -PskipTests=true and -DskipTests=true
    def skip = project.findProperty("skipTests")?.toString()?.toBoolean() || Boolean.getBoolean("skipTests")
    onlyIf { !skip }

    include '**/EppClientTestSuite.class'
    finalizedBy jacocoTestReport
}
